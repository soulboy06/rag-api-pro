server {
    listen 80;
    server_name _;

    # Allow uploading larger documents (up to 100MB)
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    # Keep the API same-origin for the browser. The upstream name is resolved
    # by Docker Compose on its internal network.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for token-by-token SSE responses.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React client-side routes must be served by the application entrypoint.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
